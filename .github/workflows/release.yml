name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run unit tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Build + sign + package (Linux)
      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          mkdir -p dist/linux
          go build -trimpath -ldflags "-s -w -X catmint/cmd.version=${GITHUB_REF_NAME}" -o dist/linux/catmint

      - name: Linux checksum + sign (keyless) + README.txt
        run: |
          set -euo pipefail

          # checksum file in folder linux
          (cd dist/linux && sha256sum catmint > checksum-sha256.txt)

          # sign checksum and upload to Rekor; keep bundle (contains tlog logIndex)
          cosign sign-blob --yes \
            --bundle dist/linux/checksum-sha256.txt.bundle \
            dist/linux/checksum-sha256.txt

          # extract logIndex for online verification link
          LINUX_LOGINDEX="$(jq -r '.. | objects | .logIndex? // empty' dist/linux/checksum-sha256.txt.bundle | head -n 1)"
          echo "LINUX_LOGINDEX=$LINUX_LOGINDEX" >> "$GITHUB_ENV"

          # plain-text README for Notepad-friendly viewing
          cat > dist/linux/README.txt << EOF
          catmint - Installation & Verification Guide (Linux)

          INSTALLATION
          1. Move the "catmint" binary to a directory in your PATH, for example:
             /usr/local/bin

          2. Make the binary executable:
             chmod +x catmint

          3. Open a new terminal and run:
             catmint --version
             catmint --help

          If both commands run successfully, installation is complete.

          ONLINE VERIFICATION
          This release is cryptographically signed and recorded in the Sigstore Transparency Log (Rekor).
          Online verification can be performed in a browser using the logIndex below.

          Sigstore Rekor Search:
          https://search.sigstore.dev/?logIndex=${LINUX_LOGINDEX}

          How to check:
          1. Open the link above.
          2. Confirm that the entry shows an artifact signed by GitHub Actions from this repository.

          Files in this package:
          - catmint
          - checksum-sha256.txt
          - checksum-sha256.txt.bundle
          - README.txt
          EOF

      - name: Package Linux folder (tar.gz)
        run: |
          set -euo pipefail
          tar -C dist -czf dist/catmint-linux-amd64.tar.gz linux

      # Build + sign + package (Windows)
      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          mkdir -p dist/windows
          go build -trimpath -ldflags "-s -w -X catmint/cmd.version=${GITHUB_REF_NAME}" -o dist/windows/catmint.exe

      - name: Windows checksum + sign (keyless) + README.txt
        run: |
          set -euo pipefail

          (cd dist/windows && sha256sum catmint.exe > checksum-sha256.txt)

          cosign sign-blob --yes \
            --bundle dist/windows/checksum-sha256.txt.bundle \
            dist/windows/checksum-sha256.txt

          WINDOWS_LOGINDEX="$(jq -r '.. | objects | .logIndex? // empty' dist/windows/checksum-sha256.txt.bundle | head -n 1)"
          echo "WINDOWS_LOGINDEX=$WINDOWS_LOGINDEX" >> "$GITHUB_ENV"

          cat > dist/windows/README.txt << EOF
          catmint - Installation & Verification Guide (Windows)

          INSTALLATION
          1. Create a directory, for example:
             C:\catmint\

          2. Move "catmint.exe" into that directory.

          3. Add C:\catmint to your PATH environment variable.

          4. Close and reopen Command Prompt or PowerShell.

          5. Run:
             catmint --version
             catmint --help

          If both commands run successfully, installation is complete.

          ONLINE VERIFICATION
          This release is cryptographically signed and recorded in the Sigstore Transparency Log (Rekor).
          Online verification can be performed in a browser using the logIndex below.

          Sigstore Rekor Search:
          https://search.sigstore.dev/?logIndex=${WINDOWS_LOGINDEX}

          How to check:
          1. Open the link above.
          2. Confirm that the entry shows an artifact signed by GitHub Actions from this repository.

          Files in this package:
          - catmint.exe
          - checksum-sha256.txt
          - checksum-sha256.txt.bundle
          - README.txt
          EOF

      - name: Package Windows folder (zip)
        run: |
          set -euo pipefail
          (cd dist && zip -r catmint-windows-amd64.zip windows)

      # Release Notes
      - name: Generate Release Notes
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"

          awk -v tag="## [${TAG_NAME}]" '
            $0 == tag || index($0, tag " ") == 1 || index($0, tag " - ") == 1 {
              found=1
              next
            }
            found && /^## / {
              exit
            }
            found {
              print
            }
          ' CHANGELOG.md > CHANGELOG_SECTION.txt

          if [ ! -s CHANGELOG_SECTION.txt ]; then
            cat > CHANGELOG_SECTION.txt << EOF
          Release notes for ${TAG_NAME} were not found in CHANGELOG.md.
          EOF
          fi

          cat > RELEASE_NOTES.txt << EOF
          # catmint ${TAG_NAME}

          catmint is a CLI tool for generating and verifying file hashes, with support for recursive directory hashing, exportable references, and CI-friendly verification.

          ## Changes

          $(cat CHANGELOG_SECTION.txt)

          ## Release Assets

          - Linux amd64
          - Windows amd64

          ## Online Verification

          This release is signed keylessly using GitHub Actions OIDC and recorded in Sigstore Rekor.
          You can verify release provenance using the links below.

          Linux:
          https://search.sigstore.dev/?logIndex=${LINUX_LOGINDEX}

          Windows:
          https://search.sigstore.dev/?logIndex=${WINDOWS_LOGINDEX}

          The Rekor entries show signing time, artifact hash, and GitHub Actions workflow identity.
          EOF

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.txt
          files: |
            dist/catmint-linux-amd64.tar.gz
            dist/catmint-windows-amd64.zip
